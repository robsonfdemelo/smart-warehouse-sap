_schema-version: 3.3.0
ID: smart-warehouse-sap
version: 1.0.0
description: "Smart Warehouse SAP"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: smart-warehouse-sap-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: smart-warehouse-sap-auth
      - name: smart-warehouse-sap-db
  - name: smart-warehouse-sap
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api # must be used in xs-app.json as well
          url: ~{srv-url}
          forwardAuthToken: true
      - name: smart-warehouse-sap-auth
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: smart-warehouse-sap-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: smart-warehouse-sap-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Operator (smart-warehouse-sap ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.Operator'
    requires:
      - name: app-api

  - name: smart-warehouse-sap-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: smart-warehouse-hdi
