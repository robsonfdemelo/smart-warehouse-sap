
name: Smart Warehouse - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate CAP model
        run: npx cds compile srv --to edmx

      - name: Build CAP
        run: npx cds build

      - name: Validate SAPUI5 XML
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('app/smart-warehouse-ui/webapp/view/Main.view.xml'); print('SAPUI5 XML validado')"
